name: Pipeline CI/CD DevSecOps - Cuidarte+

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ETAPA 1: Shift-Left (Detección de secretos y auditoría de dependencias)
  shift-left-security:
    name: 1. Source & Shift-Left (Secrets y Dependencias)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente (Source)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detección temprana de secretos hardcodeados (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auditoría de dependencias vulnerables (Backend y Frontend)
        run: |
          cd BACKEND && npm ci && npm audit --audit-level=high
          cd ../FRONTEND && npm ci && npm audit --audit-level=high

  # ETAPA 2: Análisis Estático de Seguridad SAST (Semgrep OWASP / CWE)
  sast-static-analysis:
    name: 2. Análisis Estático SAST (Código Fuente y Docker)
    runs-on: ubuntu-latest
    needs: shift-left-security
    container:
      image: semgrep/semgrep
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      # Triaje SAST: se excluyen etiquetas de Actions y middleware CSRF (API stateless con Bearer JWT, sin cookies)
      - name: Ejecutar escaneo SAST (JavaScript, React, Express y Dockerfile)
        run: >
          semgrep scan --config auto --error
          --exclude="FRONTEND/tests"
          --exclude-rule="yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag"
          --exclude-rule="javascript.express.security.audit.express-check-csurf-middleware-usage.express-check-csurf-middleware-usage"

  # ETAPA 3: Build Docker, Pruebas E2E (Playwright) y DAST (OWASP ZAP)
  build-test-dast:
    name: 3. Build, E2E (Playwright) y DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: sast-static-analysis
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Construir y levantar entorno aislado QA (Build)
        run: |
          export POSTGRES_USER=postgres
          export POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
          [ -z "$POSTGRES_PASSWORD" ] && export POSTGRES_PASSWORD=$(openssl rand -hex 16)
          export POSTGRES_DB=cuidarteplus
          export JWT_SECRET="${{ secrets.JWT_SECRET }}"
          [ -z "$JWT_SECRET" ] && export JWT_SECRET=$(openssl rand -hex 32)
          export ALLOWED_ORIGINS="http://localhost:3333,http://172.17.0.1:3333"
          docker compose up -d --build

      - name: Esperar disponibilidad de Frontend (:3333) y Backend (:4444)
        run: |
          timeout 60 bash -c 'until curl -s http://localhost:3333 > /dev/null && curl -s http://localhost:4444 > /dev/null; do sleep 2; done'

      - name: Ejecutar suite automatizada E2E y Normativa (Playwright)
        run: |
          cd FRONTEND
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
          
      - name: Ejecutar prueba de rendimiento y carga (k6 - 200 VUs)
        run: |
          docker run --rm --network=host \
            -v "$(pwd)/PERFORMANCE:/scripts" \
            -e TARGET_URL="http://172.17.0.1:3333" \
            grafana/k6 run /scripts/k6-frontend-load.js    

      - name: Ejecutar escaneo dinámico de seguridad DAST (OWASP ZAP)
        run: |
          mkdir -p zap-reports && chmod 777 zap-reports
          EXIT_CODE=0
          docker run --rm -v "$(pwd)/zap-reports:/zap/wrk/:rw" --network=host \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://172.17.0.1:3333 \
            -J report_json.json -w report_md.md -r report_html.html || EXIT_CODE=$?
          if [ "$EXIT_CODE" -eq 1 ] || [ "$EXIT_CODE" -eq 3 ]; then
            echo "OWASP ZAP detectó vulnerabilidades críticas (código $EXIT_CODE)"
            exit 1
          fi

      - name: Guardar reporte de auditoría DAST (OWASP ZAP)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-zap-report
          path: zap-reports/

      - name: Apagar entorno QA
        if: always()
        run: docker compose down -v

# ETAPA 4: Compuerta de Liberación (Release Gate GO)
  deploy-production:
    name: 4. Release Gate & Deploy (Estado GO)
    runs-on: ubuntu-latest
    needs: build-test-dast
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Certificar despliegue a Produccion
        run: echo "Controles Shift-Left, SAST, E2E y DAST aprobados. Estado GO."